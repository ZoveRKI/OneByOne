name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Frontend code
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@v4
        with:
          install_args: "node pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Lint
        run: pnpm run lint

      - name: Frontend Format
        run: pnpm run fmt:check

      - name: Frontend Build
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Frontend Tests
        run: pnpm run test

  backend:
    name: Backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - name: Checkout Backend code
        uses: actions/checkout@v7

      # 不带参数时按仓库根目录的 rust-toolchain.toml 安装 Rust 和其中列出的组件
      - name: Set up Rust
        id: rust
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.version }}-

      # 这里不构建前端：没有 web/dist 时会嵌入占位页面，后端的检查和测试不受影响
      - name: Backend Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Backend Format
        run: cargo fmt --check

      - name: Backend Build
        run: cargo build --all-targets --locked

      # --no-fail-fast：一个测试目标失败后继续运行其余目标，测试报告里的统计才完整
      - name: Backend Tests
        id: backend-tests
        run: cargo test --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test-output.txt"

      - name: Backend Test Summary
        if: ${{ !cancelled() && (steps.backend-tests.outcome == 'success' || steps.backend-tests.outcome == 'failure') }}
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
        run: |
          cargo run --locked --quiet --manifest-path ../.github/scripts/Cargo.toml --bin cargo-test-summary -- \
            --outcome "$TEST_OUTCOME" "$RUNNER_TEMP/cargo-test-output.txt"
