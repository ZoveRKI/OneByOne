<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneByOne</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M12 9v14l10-7z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // 在样式生效前确定主题，避免页面先闪一下浅色
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('onebyone-theme');
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <!-- 命令行生成页面时，会把讲解数据写进这个标签；null 表示没有内嵌数据 -->
    <script id="onebyone-data" type="application/json">
      null
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
